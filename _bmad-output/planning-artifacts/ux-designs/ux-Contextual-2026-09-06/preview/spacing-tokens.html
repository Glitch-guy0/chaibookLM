<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spacing — Contextual Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--fg:#111111;--muted:#555555;--bg:#F4F4F0;--surface:#FFFFFF;--border:#111111;--accent:#FFE500;--mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);padding:40px 24px}
h1{font-weight:700;font-size:1.6rem;margin-bottom:8px}
.sub{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:32px}
.section{margin-bottom:40px}
h2{font-weight:700;font-size:1rem;margin-bottom:16px}
.scale{display:flex;flex-direction:column;gap:12px}
.sp-row{display:flex;align-items:center;gap:16px}
.sp-bar{background:var(--fg);height:24px}
.sp-label{font-size:.68rem;width:120px;flex:none}
.sp-hex{font-size:.62rem;color:var(--muted);width:60px;flex:none}
.radii{display:flex;gap:16px;flex-wrap:wrap}
.r-box{width:120px;height:80px;border:2px solid var(--border);background:var(--surface);display:grid;place-items:center;font-size:.66rem;box-shadow:4px 4px 0 0 var(--border)}
</style>
</head>
<body>
<h1>Spacing Scale</h1>
<p class="sub">4px base unit · 5 steps</p>

<div class="section">
<h2>Spacing Tokens</h2>
<div class="scale">
  <div class="sp-row"><span class="sp-label">xs — 4px</span><div class="sp-bar" style="width:4px"></div><span class="sp-hex">4px</span></div>
  <div class="sp-row"><span class="sp-label">sm — 8px</span><div class="sp-bar" style="width:8px"></div><span class="sp-hex">8px</span></div>
  <div class="sp-row"><span class="sp-label">md — 16px</span><div class="sp-bar" style="width:16px"></div><span class="sp-hex">16px</span></div>
  <div class="sp-row"><span class="sp-label">lg — 24px</span><div class="sp-bar" style="width:24px"></div><span class="sp-hex">24px</span></div>
  <div class="sp-row"><span class="sp-label">xl — 40px</span><div class="sp-bar" style="width:40px"></div><span class="sp-hex">40px</span></div>
</div>
</div>

<div class="section">
<h2>Corner Radii</h2>
<div class="radii">
  <div class="r-box" style="border-radius:2px">sm — 2px</div>
  <div class="r-box" style="border-radius:4px">md — 4px</div>
  <div class="r-box" style="border-radius:9999px">pill — 9999px</div>
</div>
</div>
</body>
</html>
