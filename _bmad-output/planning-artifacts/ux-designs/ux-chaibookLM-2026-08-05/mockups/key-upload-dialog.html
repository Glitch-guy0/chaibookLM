<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chaibookLM — Add a source (upload dialog)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Governing spine:
   DESIGN.md Components: dialog, button-primary, button-secondary
   DESIGN.md Elevation & Depth: overlay-dim backdrop, 8px 8px 0 0 dialog shadow, slanted buttons
   DESIGN.md Typography: Space Grotesk for working text, Space Mono for evidence microcopy
   DESIGN.md Dark mode: class strategy (body.dark), same AA floor
   EXPERIENCE.md Component Patterns: Upload dialog — two paths (paste text / add webpage),
     empty/whitespace-only text rejected inline
   EXPERIENCE.md Key Flows: Flow 1 — UJ-1, workspace is tabbed (Sources | Chat | Showcase)
   Developer Contract: unique stable data-debug names on every component instance (zero visual impact)
*/

:root{
  --surface:#FAF4E9;
  --surface-elevated:#FFFFFF;
  --ink:#17130E;
  --ink-secondary:#5A5146;
  --ink-muted:#766E63;
  --border:#17130E;
  --brand:#FF5C1A;
  --brand-ink:#1A0A00;
  --cite:#1E5EFF;
  --cite-ink:#FFFFFF;
  --accent-yellow:#FFD60A;
  --accent-pink:#FF3D8B;
  --success:#0B8A4B;
  --warning:#B88200;
  --error:#D62828;
  --overlay-dim:rgba(23,19,14,0.55);
}

body.dark{
  --surface:#16130D;
  --surface-elevated:#201C14;
  --ink:#F2E9DC;
  --ink-secondary:#C9BEB0;
  --ink-muted:#A79B8B;
  --border:#F2E9DC;
  --brand:#FF7A3D;
  --brand-ink:#1A0A00;
  --cite:#6FA8FF;
  --cite-ink:#0A1A3D;
  --accent-yellow:#FFE14D;
  --accent-pink:#FF6FA8;
  --success:#3ECB7B;
  --warning:#E8B100;
  --error:#FF6B6B;
  --overlay-dim:rgba(13,11,7,0.55);
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }
body{
  background:var(--surface);
  color:var(--ink);
  font-family:'Space Grotesk',system-ui,sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
.btn-primary:focus-visible,
.dialog-tab:focus-visible{ outline-color:var(--surface); }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

/* ---- Dimmed workspace mock (tabbed — Sources | Chat | Showcase, no rail) ---- */
.workspace-mock{
  min-height:100vh;
  padding:24px;
}
.mock-topbar{
  display:flex; align-items:center; gap:12px;
  margin-bottom:12px;
}
.mock-mark{
  width:32px; height:32px;
  background:var(--brand); border:2px solid var(--border);
  color:var(--brand-ink);
  font-family:'Archivo Black',sans-serif; font-size:16px;
  display:flex; align-items:center; justify-content:center;
}
.mock-tabs{
  display:flex;
  border:2px solid var(--border);
  box-shadow:4px 4px 0 0 var(--ink);
  background:var(--surface);
}
.mock-tab{
  flex:1 1 0;
  padding:10px 16px;
  text-align:center;
  font-size:14px; font-weight:600;
  border-right:2px solid var(--border);
  color:var(--ink-secondary);
}
.mock-tab:last-of-type{ border-right:none; }
.mock-tab-active{ background:var(--brand); color:var(--brand-ink); }
.mock-chat{
  margin-top:12px;
  max-width:672px;
  min-height:360px;
  border:2px solid var(--border);
  box-shadow:4px 4px 0 0 var(--ink);
  background:var(--surface-elevated);
}

/* ---- Backdrop + dialog ---- */
.backdrop{ position:fixed; inset:0; background:var(--overlay-dim); z-index:10; }

.dialog{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:520px;
  max-width:calc(100vw - 32px);
  background:var(--surface-elevated);
  border:3px solid var(--border);
  box-shadow:8px 8px 0 0 var(--ink);
  z-index:20;
  padding:28px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.dialog-title{ font-family:'Archivo Black',sans-serif; font-size:24px; font-weight:400; line-height:1.2; }

/* ---- Source type tabs ---- */
.dialog-tabs{ display:flex; border-bottom:2px solid var(--border); }
.dialog-tab{
  padding:10px 4px;
  margin-right:20px;
  font-size:16px; font-weight:500;
  color:var(--ink-muted);
  border-bottom:4px solid transparent;
  margin-bottom:-2px;
}
.dialog-tab:hover{ color:var(--ink); }
.dialog-tab-active{ color:var(--ink); font-weight:600; border-bottom-color:var(--ink); }

/* ---- Paste text path ---- */
.dialog-field{ display:flex; flex-direction:column; gap:10px; }
.field-label{ font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:500; }
.dialog-textarea{
  width:100%;
  min-height:112px;
  background:var(--surface-elevated);
  border:2px solid var(--border);
  box-shadow:2px 2px 0 0 var(--ink);
  padding:12px 14px;
  font-family:'Space Grotesk',sans-serif;
  font-size:15px; line-height:1.6;
  color:var(--ink);
  resize:vertical;
}
.rejection{
  display:flex; align-items:center; gap:8px;
  font-family:'Space Mono',monospace;
  font-size:12.5px; line-height:1.5;
  color:var(--error);
}
.rejection .dot{ width:8px; height:8px; border-radius:9999px; background:var(--error); flex:none; }

/* ---- Footer row: slanted buttons ---- */
.dialog-footer{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:4px; }
.hint-line{ font-family:'Space Mono',monospace; font-size:12px; line-height:1.4; color:var(--ink-muted); }

.btn{
  position:relative;
  display:inline-flex; align-items:center; justify-content:center;
  border:2px solid var(--border);
  font-size:16px; font-weight:600; line-height:1.2;
  padding:12px 20px;
  white-space:nowrap;
  transform:skewX(-6deg);
  transition:transform 120ms ease;
}
.btn > *{ transform:skewX(6deg); }
.btn::after{
  content:""; position:absolute; inset:0; z-index:-1;
  background:var(--ink);
  transform:skewX(-12deg) translate(6px,-6px);
  transition:transform 120ms ease;
}
.btn:hover{ transform:skewX(-10deg); }
.btn:hover::after{ transform:skewX(-14deg) translate(8px,-9px); }
.btn:active{ transform:skewX(-6deg); }
.btn:active::after{ transform:skewX(-6deg) translate(0,0); }
.btn-secondary{ background:var(--surface-elevated); color:var(--ink); margin-right:12px; }
.btn-primary{ background:var(--brand); color:var(--brand-ink); }
</style>
</head>
<body data-theme="light">

<!-- Dimmed tabbed workspace mock -->
<div class="workspace-mock" aria-hidden="true">
  <div class="mock-topbar">
    <div class="mock-mark">c</div>
    <span>Indoor Plant Care</span>
  </div>
  <div class="mock-tabs">
    <span class="mock-tab">Sources</span>
    <span class="mock-tab mock-tab-active">Chat</span>
    <span class="mock-tab">Showcase</span>
  </div>
  <div class="mock-chat"></div>
</div>

<div class="backdrop" data-debug="dialog-backdrop"></div>

<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" data-debug="upload-dialog">
  <h2 class="dialog-title" id="dialog-title">Add a source</h2>

  <div class="dialog-tabs" role="tablist" aria-label="Source type" data-debug="upload-dialog-tabs">
    <button type="button" role="tab" id="tab-paste" aria-selected="true" class="dialog-tab dialog-tab-active" data-debug="upload-dialog-tab-paste">Paste text</button>
    <button type="button" role="tab" id="tab-web" aria-selected="false" class="dialog-tab" data-debug="upload-dialog-tab-web">Add webpage</button>
  </div>

  <div class="dialog-field" role="tabpanel" aria-labelledby="tab-paste" data-debug="upload-dialog-path-paste">
    <label class="field-label" for="source-text">Your text</label>
    <textarea class="dialog-textarea" id="source-text" name="source-text">Overwatering is the most common cause of indoor plant problems. Let the top inch of soil dry out before watering again, and always use a pot that drains freely.</textarea>
    <p class="rejection" data-debug="upload-dialog-rejection" aria-live="polite"><span class="dot" aria-hidden="true"></span>Enter some text to add it to this notebook.</p>
  </div>

  <div class="dialog-footer">
    <span class="hint-line">5 MB max per source</span>
    <span>
      <button type="button" class="btn btn-secondary" data-debug="upload-dialog-cancel"><span>Cancel</span></button>
      <button type="button" class="btn btn-primary" data-debug="upload-dialog-submit"><span>Add to notebook</span></button>
    </span>
  </div>
</div>

</body>
</html>
